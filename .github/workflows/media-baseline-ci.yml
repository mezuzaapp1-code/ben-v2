name: Isolated media baseline
on:
  push:
    branches: [astra/media-baseline-ci-20260928]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: media_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: media_v1_test_baseline
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U media_ci -d media_v1_test_baseline"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEDIA_TEST_DATABASE_URL: postgresql://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_baseline
      DATABASE_URL: postgresql+asyncpg://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_baseline
      BEN_MEDIA_INTERNAL_ENABLED: '0'
      BEN_DB_CONNECT_TIMEOUT_S: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install local composer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test narration interface
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:media
          npm run test:narration
          node scripts/test-mobile-upload.mjs
          node scripts/test-new-project.mjs
          node scripts/test-video-editor.mjs
          node scripts/test-photo-source.mjs
          npm run test:project-library
          npm run test:clean-chat
          npm run build
      - name: Project creation and retired onboarding
        run: python -m pytest tests/test_project_auth.py tests/test_conversational_init.py -q
      - name: Narration capability gate
        run: python -m pytest tests/test_narration_capabilities.py -q
      - name: Record environment
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze > baseline-environment.txt
      - name: Owned photo upload and animation admission
        run: |
          python -m pytest tests/test_photo_source.py -v --junitxml=photo-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('photo-results.xml').findall('.//testcase')
          assert len(cases) == 5
          assert all(not any(c.find(tag) is not None for tag in ('skipped','failure','error')) for c in cases)
          PY
      - name: Mobile conversion and corruption acceptance
        run: python -m pytest tests/test_mobile_video.py -v --junitxml=mobile-results.xml
      - name: Mobile upload worker and authorized delivery
        run: python -m pytest tests/test_mobile_import.py -v --junitxml=mobile-import-results.xml
      - name: Require import integration without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('mobile-import-results.xml').findall('.//testcase')
          assert len(cases) == 8, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Require mobile acceptance without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('mobile-results.xml').findall('.//testcase')
          assert len(cases) == 11, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Run real MP4 and PostgreSQL disconnect baseline
        run: python -m pytest tests/test_local_publication_baseline.py -v --junitxml=baseline-results.xml
      - name: Require both tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('baseline-results.xml').findall('.//testcase')
          assert len(cases) == 2, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Attempt isolation fault injection
        run: python -m pytest tests/test_media_attempt_isolation.py -v --junitxml=attempt-results.xml
      - name: Require all attempt cases without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('attempt-results.xml').findall('.//testcase')
          assert len(cases) == 11, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Narration replacement acceptance
        run: python -m pytest tests/test_narration_replacement.py -v --junitxml=narration-results.xml
      - name: Require all narration cases without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('narration-results.xml').findall('.//testcase')
          assert len(cases) == 14, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Existing media and Direct Chat regressions
        run: >-
          python -m pytest tests/test_media_migration.py tests/test_media_repository.py
          tests/test_media_image_foundation.py tests/test_media_vertical_slice.py
          tests/test_bfl_media.py tests/test_bfl_repository.py
          tests/test_veo_media.py tests/test_veo_repository.py
          tests/test_kling_media.py tests/test_kling_repository.py
          tests/test_chat_provider_routing.py tests/test_chat_provider_transparency.py
          tests/test_workspace_files_v1.py tests/test_workspace_files_durable_storage.py
          -q --junitxml=regression-results.xml
      - name: Dedicated media database role gate
        run: python -m pytest tests/test_media_connection.py -v --junitxml=media-connection-results.xml
      - name: Require role gate without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('media-connection-results.xml').findall('.//testcase')
          assert len(cases) == 5, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - name: Narration API and authorization
        run: python -m pytest tests/test_narration_api.py -v --junitxml=narration-api-results.xml
      - name: Require all API cases without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('narration-api-results.xml').findall('.//testcase')
          assert len(cases) == 11, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-baseline-evidence
          path: |
            baseline-results.xml
            baseline-environment.txt
            attempt-results.xml
            regression-results.xml
            narration-results.xml
            narration-api-results.xml
            media-connection-results.xml
            mobile-results.xml
            mobile-import-results.xml
