name: Private editing persistence
on:
  push:
    branches: [astra/editor-document-v1]
  pull_request:
    paths:
      - 'services/media/**'
      - 'routers/media.py'
      - 'routers/edit_documents.py'
      - 'database/migrations/versions/video_edit_documents_v1.py'
      - 'tests/test_edit*.py'
      - '.github/workflows/edit-persistence.yml'
      - 'frontend/src/components/*Editor*'
      - 'frontend/src/components/FreeTextLayer.jsx'
      - 'frontend/src/components/TextAppearanceControls.jsx'
      - 'frontend/src/components/MediaComposer.jsx'
      - 'frontend/src/App.jsx'
      - 'frontend/src/lib/edit*.js'
      - 'frontend/src/lib/subtitle*.js'
      - 'frontend/src/lib/textAppearance.js'
      - 'frontend/scripts/test-*editor*.mjs'
      - 'frontend/scripts/test-edit-session.mjs'
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Saved editing and existing controls
        working-directory: frontend
        run: |
          node scripts/test-edit-session.mjs
          node scripts/test-video-editor.mjs
          node scripts/test-saved-editor-ui.mjs
          node scripts/test-media.mjs
          node scripts/test-narration-ui.mjs
          node scripts/test-clerk-persistent-access.mjs
          node scripts/test-auth-header-stability.mjs
      - name: Lint new editor modules
        working-directory: frontend
        run: npx eslint src/lib/editSession.js src/components/SavedVideoEditor.jsx src/components/VideoSubtitleEditor.jsx src/components/FreeTextLayer.jsx src/components/TextAppearanceControls.jsx src/lib/editorStorage.js src/lib/subtitleCommands.js src/lib/textAppearance.js
      - run: npm run build
        working-directory: frontend
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edit_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: media_v1_test_edits
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U edit_ci -d media_v1_test_edits"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEDIA_TEST_DATABASE_URL: postgresql://edit_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_edits
      DATABASE_URL: postgresql+asyncpg://edit_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_edits
      BEN_MEDIA_INTERNAL_ENABLED: '0'
      BEN_MEDIA_EDIT_DOCUMENTS_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Contract, real PostgreSQL persistence and existing media regressions
        run: >-
          python -m pytest tests/test_edit_document.py tests/test_edit_persistence.py
          tests/test_media_repository.py tests/test_media_migration.py
          tests/test_media_connection.py tests/test_media_vertical_slice.py
          tests/test_narration_capabilities.py
          -q --junitxml=edit-persistence-results.xml
      - name: Require every case to execute and pass
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse('edit-persistence-results.xml').findall('.//testcase')
          assert cases
          assert all(not any(c.find(t) is not None for t in ('skipped','failure','error')) for c in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-persistence-evidence
          path: edit-persistence-results.xml
