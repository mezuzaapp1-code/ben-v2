name: Media V1 development validation

on:
  workflow_dispatch:
    inputs:
      gemini_live_proof:
        description: 'Authorize the protected, single paid Gemini image proof (never rerun)'
        required: true
        default: false
        type: boolean
      bfl_live_proof:
        description: 'Authorize one protected paid BFL image proof (never rerun)'
        required: true
        default: false
        type: boolean
      veo_live_proof:
        description: 'Authorize one protected paid Veo video proof (never rerun)'
        required: true
        default: false
        type: boolean
      kling_live_proof:
        description: 'Authorize exactly one protected paid Kling I2V proof (never rerun)'
        required: true
        default: false
        type: boolean
      kling_recovery_request_id:
        description: 'Existing fal request only: GET status/result; never generate'
        required: false
        default: ''
        type: string
  # Bootstrap execution without adding this workflow to the default branch.
  push:
    branches: [astra/ben-media-v1]

permissions:
  contents: read

concurrency:
  group: media-v1-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/astra/ben-media-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Repository test harness targets PostgreSQL 16.
        image: postgres:16
        env:
          POSTGRES_USER: media_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: media_v1_test_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U media_ci -d media_v1_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEDIA_TEST_DATABASE_URL: postgresql://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_ci
      # Ambient runtime imports must also point only to the disposable service.
      DATABASE_URL: postgresql+asyncpg://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_ci
      BEN_MEDIA_INTERNAL_ENABLED: '0'
      BEN_DB_CONNECT_TIMEOUT_S: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkpoint lineage and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4c9ac1a344f895911d38d6a87f468cbb7ce30e4b HEAD
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # runtime.txt
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Lockfile engines: ESLint >=22.13; Vite >=20.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install normal locked development dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm --prefix frontend ci
          python --version
          node --version
      - name: Production frontend build
        run: npm --prefix frontend run build
      - name: PostgreSQL media gates (10 database cases plus DDL)
        run: |
          python -m pytest tests/test_media_repository.py tests/test_media_migration.py -q --junitxml=media-database.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('media-database.xml').findall('.//testcase')
          assert len(cases) == 11, f'Expected 10 database tests plus DDL; got {len(cases)}'
          assert not any(c.find('skipped') is not None for c in cases), 'Database skips are not a pass'
          PY
      - name: Relevant media and protected-path regressions
        run: |
          # Existing measurement source assertions use this fixed checkout path.
          # Supply that path; do not patch the assertions or application code.
          sudo ln -s "$GITHUB_WORKSPACE" /workspace
          python -m pytest \
            tests/test_media_vertical_slice.py tests/test_media_image_foundation.py \
            tests/test_bfl_media.py tests/test_bfl_repository.py \
            tests/test_veo_media.py tests/test_veo_repository.py tests/test_veo_proof_harness.py \
            tests/test_kling_media.py tests/test_kling_repository.py tests/test_kling_proof_harness.py \
            tests/test_gemini_provider_repair.py tests/test_deepseek_provider.py \
            tests/test_deepseek_chat.py tests/test_chat_provider_transparency.py \
            tests/test_chat_provider_routing.py tests/test_chat_switchboard_disconnected.py \
            tests/test_measurement_contracts.py tests/test_workspace_files_durable_storage.py \
            tests/test_measurement_foundation.py::test_persistence_writers_never_touch_ambient_database_url \
            -q --junitxml=media-regressions.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('media-regressions.xml').findall('.//testcase')
          assert cases and not any(c.find('skipped') is not None for c in cases), 'Regression skips are not a pass'
          PY
      - name: Frontend media and Direct Chat checks
        run: |
          npm --prefix frontend run test:media
          npm --prefix frontend run test:clean-chat
          npm --prefix frontend run test:chat-stream-ownership
          npm --prefix frontend run test:conversation-surface
          npm --prefix frontend run test:deepseek-provider-menu
          node frontend/node_modules/eslint/bin/eslint.js frontend/src/components/MediaComposer.jsx frontend/src/api/media.js frontend/scripts/test-media.mjs
      - name: Preserve test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-v1-validation-${{ github.sha }}
          path: |
            media-database.xml
            media-regressions.xml
          if-no-files-found: ignore
          retention-days: 7

  gemini-live-proof:
    name: Protected media live proof
    needs: validate
    if: github.ref == 'refs/heads/astra/ben-media-v1' && github.event_name == 'workflow_dispatch' && inputs.kling_recovery_request_id == '' && (inputs.gemini_live_proof || inputs.bfl_live_proof || inputs.veo_live_proof || inputs.kling_live_proof)
    environment: media-v1-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: media_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: media_v1_test_proof
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U media_ci -d media_v1_test_proof"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEDIA_TEST_DATABASE_URL: postgresql://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_proof
      DATABASE_URL: postgresql+asyncpg://media_ci:disposable-ci-only@127.0.0.1:5432/media_v1_test_proof
      BEN_MEDIA_INTERNAL_ENABLED: '0'
      BEN_DB_CONNECT_TIMEOUT_S: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse paid reruns and verify checkout
        run: |
          test "$GITHUB_RUN_ATTEMPT" = '1'
          python - <<'PY'
          selected = ['${{ inputs.gemini_live_proof }}', '${{ inputs.bfl_live_proof }}', '${{ inputs.veo_live_proof }}', '${{ inputs.kling_live_proof }}']
          assert selected.count('true') == 1, 'Select exactly one paid proof'
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: One image through BEN authorization, lifecycle and protected delivery
        if: inputs.gemini_live_proof
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BEN_SINGLE_IMAGE_PROOF: authorized-one-image
        # No traceback/local variables or raw provider response in CI output.
        run: python -m pytest tests/test_media_live_proof.py -q --tb=no --show-capture=no
      - name: One BFL image through durable submission, polling and protected delivery
        if: inputs.bfl_live_proof
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          BEN_SINGLE_BFL_PROOF: authorized-one-image
        run: python -m pytest tests/test_bfl_live_proof.py -q --tb=no --show-capture=no
      - name: One Veo video through the existing BEN lifecycle
        if: inputs.veo_live_proof
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BEN_SINGLE_VEO_PROOF: authorized-one-video
        run: python -m pytest tests/test_veo_live_proof.py -q --tb=no --show-capture=no
      - name: One Kling video through the existing BEN lifecycle
        if: inputs.kling_live_proof
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          BEN_SINGLE_KLING_PROOF: authorized-one-video
        run: python -m pytest tests/test_kling_live_proof.py -q --tb=no --show-capture=no
      - name: Preserve allowlisted proof evidence and generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kling_live_proof && 'kling-single-video' || inputs.veo_live_proof && 'veo-single-video' || inputs.bfl_live_proof && 'bfl-single-image' || 'gemini-single-image' }}-proof-${{ github.sha }}
          path: proof-evidence/
          if-no-files-found: ignore
          retention-days: 7

  kling-existing-recovery:
    if: github.ref == 'refs/heads/astra/ben-media-v1' && github.event_name == 'workflow_dispatch' && inputs.kling_recovery_request_id != ''
    environment: media-v1-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1 cryptography==46.0.7 av==18.1.0
      - name: GET-only existing operation investigation
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          KLING_EXISTING_REQUEST_ID: ${{ inputs.kling_recovery_request_id }}
        run: python -m tests.kling_existing_recovery
      - name: Preserve sanitized investigation and encrypted private result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kling-existing-recovery-${{ github.run_id }}
          path: recovery-evidence/
          retention-days: 30
          if-no-files-found: error
